server:
  error:
    include-message: ALWAYS
    include-binding-errors: ALWAYS
    include-stacktrace: NEVER
  forward-headers-strategy: framework
  port: 8081

spring:
  application:
    name: backend

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: backend-scheduler-

  datasource:
    url: jdbc:postgresql://postgres:5432/careerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  app:
    platform:
      base-url: https://careerhub-it.com
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    listener:
      type: simple
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 10
        acknowledge-mode: auto
        default-requeue-rejected: false
    template:
      mandatory: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "when_authorized"

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:careerhub-backend}
    access-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cookie:
    refresh-name: REFRESH
    refresh-path: /api/auth/refresh
    secure: true
    same-site: Lax
  rate-limit:
    login:
      window: PT1M
      max-attempts: 10
    refresh:
      window: PT1M
      max-attempts: 20
    forgot-password:
      window: PT15M
      max-attempts: 5
    resend-verification:
      window: PT15M
      max-attempts: 5

jobs:
  ingest:
    exchange: ingest.jobs
    external-offers-consumer:
      concurrency: 2
      max-concurrency: 2
      prefetch: 50
    routing:
      externalOffers: external-offer
      externalOffersRetry1: external-offer.retry.1m
      externalOffersRetry5: external-offer.retry.5m
      externalOffersRetry30: external-offer.retry.30m
      externalOffersDlq: external-offer.dlq
    queue:
      externalOffers: ingest.jobs.external-offers
      externalOffersRetry1: ingest.jobs.external-offers.retry.1m
      externalOffersRetry5: ingest.jobs.external-offers.retry.5m
      externalOffersRetry30: ingest.jobs.external-offers.retry.30m
      externalOffersDlq: ingest.jobs.external-offers.dlq
    retry:
      after1: PT1M
      after5: PT5M
      after30: PT30M
      jitterFactor: 0.20
  stale:
    default-cutoff: PT96H
    nfj-cutoff: PT96H
    cron: "0 0 * * * *"
  retention:
    inactive-age: PT1H
    cron: "0 0 * * * *"

events:
  meetup:
    groups:
      - warsawjs
      - pykonik
      - wrocnet

logging:
  level:
    root: INFO
    org.springframework.amqp: INFO

app:
  frontend:
    url: ${FRONTEND_URL:https://careerhub-it.com}

  mailer:
    enabled: ${MAILER_ENABLED:true}
    exchange: mailer.exchange
    routing:
      send: mail.send
      retry1: mail.retry.1m
      retry5: mail.retry.5m
      retry30: mail.retry.30m
      dlq: mail.dlq
    queue:
      send: mail.send
      retry1: mail.retry.1m
      retry5: mail.retry.5m
      retry30: mail.retry.30m
      dlq: mail.dlq
    retry:
      after1: PT1M
      after5: PT5M
      after30: PT30M
    listener:
      prefetch: 5
      concurrency: 1

    aws:
      region: ${AWS_REGION:us-east-1}
      from: ${SES_FROM}

    rate-limit:
      verification:
        min-interval: PT1M
        max-per-day: 5
      reset:
        min-interval: PT1M
        max-per-day: 5
